<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img">
<style>
  .spin { transform-box: view-box; animation: spin 36s linear infinite; }
  .spin-rev { transform-box: view-box; animation: spin 48s linear infinite reverse; }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
  .flicker { animation: flicker 6s linear infinite; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.05); opacity: 1; } }
  @keyframes flicker { 0%,18%,22%,62%,64%,100% { opacity: 1; } 20%,63% { opacity: .45; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes wave { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1FFF8B" stroke-opacity="0.06"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="220" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">

  <defs>
    <radialGradient id="fbg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#0b2416"/><stop offset="1" stop-color="#010302"/>
    </radialGradient>
    <clipPath id="fcore"><circle cx="600.0" cy="86" r="40"/></clipPath>
  </defs>
  <rect width="1200" height="220" fill="url(#fbg)"/>
  <rect width="1200" height="220" fill="url(#grid)"/>
  <rect x="446.0" y="84" width="26" height="4" rx="2" fill="#3BA8FF" style="animation: wave 2.2s ease-in-out 0.00s infinite both"/><rect x="412.0" y="84" width="26" height="4" rx="2" fill="#7BE35A" style="animation: wave 2.2s ease-in-out 0.15s infinite both"/><rect x="378.0" y="84" width="26" height="4" rx="2" fill="#C8E83A" style="animation: wave 2.2s ease-in-out 0.30s infinite both"/><rect x="344.0" y="84" width="26" height="4" rx="2" fill="#FF7A1A" style="animation: wave 2.2s ease-in-out 0.45s infinite both"/><rect x="310.0" y="84" width="26" height="4" rx="2" fill="#B0C4DE" style="animation: wave 2.2s ease-in-out 0.60s infinite both"/><rect x="276.0" y="84" width="26" height="4" rx="2" fill="#E3CF94" style="animation: wave 2.2s ease-in-out 0.75s infinite both"/><rect x="242.0" y="84" width="26" height="4" rx="2" fill="#9BE15D" style="animation: wave 2.2s ease-in-out 0.90s infinite both"/><rect x="208.0" y="84" width="26" height="4" rx="2" fill="#39FF14" style="animation: wave 2.2s ease-in-out 1.05s infinite both"/><rect x="174.0" y="84" width="26" height="4" rx="2" fill="#B57BFF" style="animation: wave 2.2s ease-in-out 1.20s infinite both"/><rect x="140.0" y="84" width="26" height="4" rx="2" fill="#FFE04D" style="animation: wave 2.2s ease-in-out 1.35s infinite both"/><rect x="106.0" y="84" width="26" height="4" rx="2" fill="#FF4D4D" style="animation: wave 2.2s ease-in-out 1.50s infinite both"/><rect x="694.0" y="84" width="26" height="4" rx="2" fill="#3BA8FF" style="animation: wave 2.2s ease-in-out 0.00s infinite both"/><rect x="728.0" y="84" width="26" height="4" rx="2" fill="#7BE35A" style="animation: wave 2.2s ease-in-out 0.15s infinite both"/><rect x="762.0" y="84" width="26" height="4" rx="2" fill="#C8E83A" style="animation: wave 2.2s ease-in-out 0.30s infinite both"/><rect x="796.0" y="84" width="26" height="4" rx="2" fill="#FF7A1A" style="animation: wave 2.2s ease-in-out 0.45s infinite both"/><rect x="830.0" y="84" width="26" height="4" rx="2" fill="#B0C4DE" style="animation: wave 2.2s ease-in-out 0.60s infinite both"/><rect x="864.0" y="84" width="26" height="4" rx="2" fill="#E3CF94" style="animation: wave 2.2s ease-in-out 0.75s infinite both"/><rect x="898.0" y="84" width="26" height="4" rx="2" fill="#9BE15D" style="animation: wave 2.2s ease-in-out 0.90s infinite both"/><rect x="932.0" y="84" width="26" height="4" rx="2" fill="#39FF14" style="animation: wave 2.2s ease-in-out 1.05s infinite both"/><rect x="966.0" y="84" width="26" height="4" rx="2" fill="#B57BFF" style="animation: wave 2.2s ease-in-out 1.20s infinite both"/><rect x="1000.0" y="84" width="26" height="4" rx="2" fill="#FFE04D" style="animation: wave 2.2s ease-in-out 1.35s infinite both"/><rect x="1034.0" y="84" width="26" height="4" rx="2" fill="#FF4D4D" style="animation: wave 2.2s ease-in-out 1.50s infinite both"/>
  
    <circle cx="600.0" cy="86" r="52" fill="none" stroke="#1FFF8B" stroke-width="2">
      <animate attributeName="r" values="52;120" dur="2.4s" begin="0.00s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600.0" cy="86" r="52" fill="none" stroke="#1FFF8B" stroke-width="2">
      <animate attributeName="r" values="52;120" dur="2.4s" begin="0.80s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" begin="0.80s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600.0" cy="86" r="52" fill="none" stroke="#1FFF8B" stroke-width="2">
      <animate attributeName="r" values="52;120" dur="2.4s" begin="1.60s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" begin="1.60s" repeatCount="indefinite"/>
    </circle>
  <circle cx="600.0" cy="86" r="52" fill="#030706" stroke="#1FFF8B" stroke-width="3" filter="url(#glow)"/>
  <g class="breathe" filter="url(#glow)"><g clip-path="url(#fcore)">
    <g>
      <circle cx="600.0" cy="86" r="40" fill="#1FFF8B"/>
      <polygon points="556.8,51.6 594.4,86 556.8,120.4" fill="#030706"/>
      <polygon points="643.2,51.6 605.6,86 643.2,120.4" fill="#030706"/>
    </g></g></g>
  <text x="600.0" y="186" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="34" font-weight="900"
        letter-spacing="10" fill="#1FFF8B" filter="url(#glow)" class="flicker">IT'S HERO TIME</text>

</g>
<rect x="1" y="1" width="1198" height="218" rx="23" fill="none" stroke="#113C25" stroke-width="2"/>
</svg>
