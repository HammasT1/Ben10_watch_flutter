name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build universal APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      - name: Save universal APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/ben10-watch-${{ steps.version.outputs.name }}-universal.apk"

      - name: Build per-ABI APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      - name: Save per-ABI APKs
        run: |
          OUT=build/app/outputs/flutter-apk
          V=${{ steps.version.outputs.name }}
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/ben10-watch-${V}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/ben10-watch-${V}-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist/ben10-watch-${V}-x86_64.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ben10-watch-apks
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
